version: 1
sampleRate: 24000
channels: 2
chunkSamples: 4096
stages:
  - name: upmix
    params: { mode: center }
  - name: wsola
    params: { semitones: -2.5 }
  - name: gate
    params: { threshold: -45, ratio: 10, attack: 5, release: 150 }
  - name: chorus
    params: { baseDelay: 0.02, depth: 0.0008, speedHz: 0.5, stages: 2, mix: 0.1 }
  - name: eq
    params: { type: highpass, freq: 100, q: 0.707 }
  - name: eq
    params: { type: peaking, freq: 3000, gain: 1.5, q: 0.8 }
  - name: compressor
    params: { threshold: -24, ratio: 4, attack: 5, release: 100 }
  - name: fdnreverb
    params: { rt60: 0.25, damp: 0.6, preDelay: 0.02, wet: 0.1, dry: 1.0 }
  - name: deesser
    params: {}
  - name: limiter
    params: { threshold: -1, release: 100 }
output:
  format: wav
  bitDepth: 16
