version: 1
sampleRate: 24000
channels: 2
chunkSamples: 4096
stages:
  - name: upmix
    params: { mode: center }
  - name: wsola
    params: { semitones: -1 }
  - name: formant
    params: { shift: 1.15 }
  - name: chorus
    params: { baseDelay: 0.02, depth: 0.0008, speedHz: 0.5, stages: 2, mix: 0.1 }
  - name: eq
    params: { type: highpass, freq: 100, q: 0.707 }
  - name: eq
    params: { type: peaking, freq: 3000, gain: 2.5, q: 0.8 }
  - name: eq
    params: { type: lowpass, freq: 7000, q: 0.707 }
  - name: fdnreverb
    params: { rt60: 0.2, damp: 0.6, preDelay: 0.02, wet: 0.08, dry: 1.0 }
  - name: compressor
    params: { threshold: -22, ratio: 2.5, attack: 15, release: 120 }
  - name: deesser
    params: {}
  - name: limiter
    params: { threshold: -1, release: 100 }
output:
  format: wav
  bitDepth: 16
